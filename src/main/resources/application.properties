# =========================================
# APP
# =========================================
spring.application.name=finances

# =========================================
# GEMINI / GOOGLE GENAI
# =========================================

# API KEY
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
app.google.tts.api-key=${GOOGLE_TTS_API_KEY}

# MODELO
# opções:
# gemini-1.5-flash
# gemini-1.5-pro
# gemini-2.0-flash
spring.ai.google.genai.chat.model=${GOOGLE_GENAI_MODEL:gemini-2.5-flash}

# TEMPERATURA
# menor = respostas mais precisas
# maior = mais criatividade
spring.ai.google.genai.chat.temperature=0.7

# TOKENS MÁXIMOS
spring.ai.google.genai.chat.max-output-tokens=2048

# TOP P
spring.ai.google.genai.chat.top-p=0.95

# TOP K
spring.ai.google.genai.chat.top-k=40
    
# =========================================
# LOGS
# =========================================

logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.web.client=DEBUG

# =========================================
# MULTIPART (áudio/imagem)
# =========================================

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# =========================================
# TIMEOUTS
# =========================================

spring.mvc.async.request-timeout=300000


spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:finances
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


# Caminho personalizado para acessar a interface gráfica do Swagger UI (Padrão: /swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html

# Caminho personalizado para a documentação em formato JSON (Padrão: /v3/api-docs)
springdoc.api-docs.path=/v3/api-docs

# Controla a ordenação dos endpoints na tela (pode ser 'alpha' para alfabética)
springdoc.swagger-ui.operationsSorter=alpha

# Desabilita o Swagger em ambiente de produção (mude para false se quiser esconder)
springdoc.swagger-ui.enabled=true